<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">Krypton Bot Light</title>
  <desc id="d">The Krypton Bot face inside a spinning energy reactor, next to the name and tagline.</desc>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6f432"/>
      <stop offset=".4" stop-color="#38bdf8"/>
      <stop offset=".75" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#c6f432" stop-opacity=".38"/>
      <stop offset="1" stop-color="#c6f432" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10140a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <style>
    .spin-a { transform-origin: 170px 150px; animation: spin 14s linear infinite; }
    .spin-b { transform-origin: 170px 150px; animation: spin 9s linear infinite reverse; }
    .spin-c { transform-origin: 170px 150px; animation: spin 22s linear infinite; }
    .pulse  { transform-origin: 170px 150px; animation: pulse 3.2s ease-in-out infinite; }
    .bob    { animation: bob 3.6s ease-in-out infinite; }
    .eyes   { transform-origin: 170px 150px; animation: scan 5s ease-in-out infinite; }
    .eye    { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    .cursor { animation: cursor 1.1s steps(1) infinite; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(.92); opacity: .75; } 50% { transform: scale(1.08); opacity: 1; } }
    @keyframes bob   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes scan  { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 70% { transform: translateX(3px); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes cursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="960" height="300" rx="20" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="959" height="299" rx="19.5" fill="none" stroke="#c6f432" stroke-opacity=".18"/>

  <!-- reactor -->
  <circle class="pulse" cx="170" cy="150" r="104" fill="url(#glow)"/>
  <g class="spin-a" fill="none">
    <circle cx="170" cy="150" r="96" stroke="url(#ring)" stroke-width="3.5" stroke-dasharray="64 18 12 18" stroke-linecap="round"/>
    <circle cx="170" cy="54" r="5" fill="#fff"/>
  </g>
  <g class="spin-b" fill="none">
    <circle cx="170" cy="150" r="76" stroke="#c6f432" stroke-opacity=".5" stroke-width="1.6" stroke-dasharray="2 9" stroke-linecap="round"/>
    <circle cx="246" cy="150" r="4" fill="#38bdf8"/>
  </g>
  <g class="spin-c" fill="none">
    <circle cx="170" cy="150" r="116" stroke="url(#ring)" stroke-opacity=".3" stroke-width="1.4" stroke-dasharray="120 60"/>
    <circle cx="54" cy="150" r="3.5" fill="#e879f9"/>
    <circle cx="286" cy="150" r="3.5" fill="#f59e0b"/>
  </g>

  <!-- bot face -->
  <g class="bob">
    <path d="M170 104 216 150 170 196 124 150Z" fill="#c6f432"/>
    <path d="M170 104 216 150H124Z" fill="#fff" opacity=".28"/>
    <path d="M170 150h46L170 196Z" fill="#000" opacity=".18"/>
    <g class="eyes">
      <rect class="eye" x="153" y="141" width="10" height="15" rx="2.5" fill="#0a0c08"/>
      <rect class="eye" x="177" y="141" width="10" height="15" rx="2.5" fill="#0a0c08"/>
    </g>
  </g>

  <!-- text -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="340" y="128" font-size="52" font-weight="700" fill="#f5f5f5" letter-spacing="-1">Krypton Bot <tspan fill="#c6f432">Light</tspan></text>
    <text x="342" y="168" font-size="21" fill="#a3a3a3">Free, self-hosted copy trading for Polymarket.</text>
    <text x="342" y="198" font-size="21" fill="#a3a3a3">Paper first. Live when you are ready. No account.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
      <rect x="342" y="222" width="400" height="38" rx="9" fill="#171717" stroke="#262626"/>
      <text x="358" y="247" fill="#c6f432">$</text>
      <text x="376" y="247" fill="#e5e5e5">npm install &amp;&amp; npm run dev</text>
      <rect class="cursor" x="662" y="233" width="9" height="18" fill="#c6f432"/>
    </g>
  </g>
</svg>
